name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      # gofmt reports every file once the checkout has CRLF endings, which git
      # produces on Windows whenever core.autocrlf is on. Pinning the checkout
      # to LF keeps the check about formatting rather than line endings.
      - name: normalize line endings
        run: |
          git config core.autocrlf false
          git rm --cached -r --quiet .
          git reset --hard --quiet
      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -s -w:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race -count=1 -timeout=5m -coverprofile=coverage.out ./...
      - name: coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -1

  # The binary ships for windows_amd64, so the platform the tests have never run
  # on is the one most likely to break. Windows gets its own job rather than a
  # matrix entry: -race needs cgo and a C compiler, which the hosted image has
  # under MSYS2 but not on PATH, so the flags differ from the unix jobs.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      # gofmt reports every file once the checkout has CRLF endings, which git
      # produces on Windows whenever core.autocrlf is on. Pinning the checkout
      # to LF keeps the check about formatting rather than line endings.
      - name: normalize line endings
        run: |
          git config core.autocrlf false
          git rm --cached -r --quiet .
          git reset --hard --quiet
      # gcc lives in MSYS2 on this image but is not on PATH. Appending to PATH
      # keeps the runner's own tools reachable; replacing it once removed
      # powershell and broke checkout before a single test ran.
      - name: put mingw on PATH
        run: echo "PATH=$PATH:/c/msys64/mingw64/bin:/c/msys64/usr/bin" >> "$GITHUB_ENV"
      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -s -w:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race -count=1 -timeout=5m ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
